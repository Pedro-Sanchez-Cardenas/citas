services:
  mysql:
    ports:
      - "3306:3306"
  workspace:
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile.dev
    container_name: workspace
    volumes:
      # Código en host, dependencias en volúmenes de contenedor
      - .:/workspace
      - /workspace/backend/vendor
      - /workspace/backend/node_modules
      - /workspace/frontend/node_modules
      - /workspace/frontend/.next
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks:
      - network
    command: sleep infinity