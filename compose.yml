services:
    nginx:
        image: nginx:1.27-alpine
        container_name: nginx
        restart: unless-stopped
        depends_on:
            - business-portal
            - customer-portal
            - backend
        ports:
            - "8080:80" # App (business-portal + API vía /api y /sanctum y /storage)
        volumes:
            - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
            # Solo para servir archivos públicos de Laravel (/storage)
            - ./backend/storage/app/public:/var/www/storage:ro
        networks:
            - network
    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: unless-stopped
        command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: citas
            MYSQL_USER: citas
            MYSQL_PASSWORD: citas
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - network
    business-portal:
        build:
            context: .
            dockerfile: docker/business-portal/Dockerfile.dev
        container_name: business-portal
        restart: unless-stopped
        depends_on:
            - backend
        expose:
            - 3000
        volumes:
            - ./business-portal:/app
            - /app/node_modules
            - /app/.next
        environment:
            - NODE_ENV=development
            - CHOKIDAR_USEPOLLING=true
            - WATCHPACK_POLLING=true
        networks:
            - network

    customer-portal:
        build:
            context: .
            dockerfile: docker/customer-portal/Dockerfile.dev
        container_name: customer-portal
        restart: unless-stopped
        depends_on:
            - backend
        expose:
            - 3001
        volumes:
            - ./customer-portal:/app
            - /app/node_modules
            - /app/.next
        environment:
            - NODE_ENV=development
            - CHOKIDAR_USEPOLLING=true
            - WATCHPACK_POLLING=true
        networks:
            - network

    backend:
        build:
            context: .
            dockerfile: docker/backend/Dockerfile.dev
        container_name: backend
        restart: unless-stopped
        depends_on:
            - mysql
        expose:
            - 8000
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY:
            APP_URL: http://localhost:8080
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: citas
            DB_USERNAME: citas
            DB_PASSWORD: citas
            CACHE_STORE: file
            SESSION_DRIVER: cookie
            FRONTEND_URL: http://localhost:8080
            SANCTUM_STATEFUL_DOMAINS: localhost:8080
        volumes:
            - ./backend:/var/www
            - backend_vendor:/var/www/vendor
        networks:
            - network
volumes:
    db_data:
    backend_vendor:

networks:
    network:
