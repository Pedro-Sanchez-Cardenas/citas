server {
    listen 80;
    server_name _;

    # Tamaño máximo de payload (subida de ficheros, etc.)
    client_max_body_size 20m;

    # FRONTEND (Next.js dev)
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Mantener websockets/hot reload de Next
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # BACKEND API (Laravel) - mismo patrón que traefik tenía
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /sanctum/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # STORAGE PÚBLICO DE LARAVEL
    # Sirve /storage/* directamente desde el volumen de Laravel
    location /storage/ {
        alias /var/www/storage/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";

        try_files $uri $uri/ =404;
    }
}

